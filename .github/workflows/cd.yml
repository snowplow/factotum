name: cd

on:
  push:
    tags:
    - '*'

jobs:
  ubuntu-x86_64:
    name: Compile Linux
    strategy:
      matrix:
        os: [ubuntu-latest]
        target: [x86_64-unknown-linux-gnu]
        arch: [x86_64]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "1.78.0"
        targets: ${{ matrix.target }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Test
      run: make test
    - name: Extract tag version from ref
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
    - name: Build
      run: make zip
      env:
        PLATFORM: linux
        ARCH: ${{ matrix.arch }}
        BUILD_VERSION: ${{ steps.get_version.outputs.VERSION }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_linux_${{ matrix.arch }}.zip
        path: build/compiled/factotum_${{ steps.get_version.outputs.VERSION }}_linux_${{ matrix.arch }}.zip

  ubuntu-arm64:
    name: Compile Linux
    strategy:
      matrix:
        os: [ubuntu-latest]
        target: [aarch64-unknown-linux-gnu]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "1.78.0"
        targets: ${{ matrix.target }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Test
      run: make test
    - name: Extract tag version from ref
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
    - name: Build
      run: make zip
      env:
        PLATFORM: linux
        ARCH: ${{ matrix.arch }}
        BUILD_VERSION: ${{ steps.get_version.outputs.VERSION }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_linux_${{ matrix.arch }}.zip
        path: build/compiled/factotum_${{ steps.get_version.outputs.VERSION }}_linux_${{ matrix.arch }}.zip

  macos-x86_64:
    name: Compile macOS
    strategy:
      matrix:
        os: [macos-latest]
        arch: [x86_64]
        target: [x86_64-apple-darwin]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "1.78.0"
        targets: ${{ matrix.target }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Test
      run: make test
    - name: Extract tag version from ref
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
    - name: Build
      run: make zip
      env:
        PLATFORM: darwin
        ARCH: ${{ matrix.arch }}
        BUILD_VERSION: ${{ steps.get_version.outputs.VERSION }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_darwin_${{ matrix.arch }}.zip
        path: build/compiled/factotum_${{ steps.get_version.outputs.VERSION }}_darwin_${{ matrix.arch }}.zip

  macos-arm64:
    name: Compile macOS
    strategy:
      matrix:
        os: [macos-latest]
        arch: [arm64]
        target: [aarch64-apple-darwin]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "1.78.0"
        targets: ${{ matrix.target }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Test
      run: make test
    - name: Extract tag version from ref
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
    - name: Build
      run: make zip
      env:
        PLATFORM: darwin
        ARCH: ${{ matrix.arch }}
        BUILD_VERSION: ${{ steps.get_version.outputs.VERSION }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_darwin_${{ matrix.arch }}.zip
        path: build/compiled/factotum_${{ steps.get_version.outputs.VERSION }}_darwin_${{ matrix.arch }}.zip

  release:
    needs: ["ubuntu-x86_64", "ubuntu-arm64", "macos-x86_64", "macos-arm64"]

    name: Release
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Extract tag version from ref
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

    - run: mkdir -p ./build/compiled

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_linux_x86_64.zip
        path: build/compiled

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_linux_arm64.zip
        path: build/compiled

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_darwin_x86_64.zip
        path: build/compiled

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factotum_${{ steps.get_version.outputs.VERSION }}_darwin_arm64.zip
        path: build/compiled

    - name: Create release and upload binaries
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        files: build/compiled/*
