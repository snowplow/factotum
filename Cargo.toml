[package]
name = "factotum"
version = "0.7.1"
authors = ["Ed Lewis <support@snowplowanalytics.com>", "Josh Beemster <support@snowplowanalytics.com>"]

[dependencies]
docopt = "0.6"
log = "0.3.5"
log4rs = "0.3.3"
daggy = "0.4.0"
rustc-serialize = "0.3.18"
valico = "0.8.2"
chrono = "0.2"
colored = "1.2"
mustache = "0.7.0"
rand = "0.3"
rust-crypto = "^0.2"
uuid = { version = "0.2", features = ["v4"] }
hyper = "^0.10"
hyper-native-tls = "0.3.0"
libc = "0.2.17"
ifaces = "0.0.3"
dns-lookup = "0.2.1"
native-tls = "=0.2.13"
signal-hook = "0.3"
lazy_static = "1.4"

# Transitive dependencies of native-tls, pinned to the last releases that build on Rust 1.78.
# Cargo.lock is not committed and Cargo 1.78 does not resolve dependencies based on rust-version.
[target.'cfg(target_vendor = "apple")'.dependencies]
# tempfile >= 3.25 allows getrandom 0.4, which requires edition 2024 (Rust 1.85+)
tempfile = ">=3.1, <3.25"

[target.'cfg(not(any(target_os = "windows", target_vendor = "apple")))'.dependencies]
# openssl >= 0.10.79 and openssl-sys >= 0.9.115 require Rust 1.80
openssl = ">=0.10, <0.10.79"
openssl-sys = ">=0.9, <0.9.115"
